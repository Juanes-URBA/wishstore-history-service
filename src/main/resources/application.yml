server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: wishstore-history-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wishstore_history_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect